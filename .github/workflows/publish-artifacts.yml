name: publish-artifacts

# Builds the Underpin OS desktop install's portable PostgreSQL + pgvector
# bundles and publishes them as releases of THIS repository.
#
# WHY THIS REPOSITORY EXISTS. The desktop install downloads these files on the
# user's first run, so they have to be reachable WITHOUT authentication. The
# product's own repository is private, so the artifacts live here, in a
# public repository, and the installer's manifest points at these releases.
#
# WHAT IS BUILT. Upstream PostgreSQL publishes no portable binaries for Linux
# or macOS (the distribution packages need root; EDB publishes the "binaries
# without installer" archive for Windows only), and upstream pgvector
# publishes no binaries at all. So the platforms that have no publisher build
# their own:
#
#   - linux/*, darwin/* — PostgreSQL built FROM SOURCE (a pinned upstream
#     tarball, verified by sha256) with pgvector built against THAT server.
#     One artifact per platform: the extension and the server it loads into
#     are one thing, so the extension ABI question cannot be asked.
#
#   - windows/amd64 — the official EDB PostgreSQL binaries (a real build, and
#     they carry the CLIENT TOOLS pg_dump/pg_restore that the desktop backup
#     needs) plus a pgvector extension built HERE, from a pinned upstream tag,
#     because upstream publishes no Windows binaries. Building it ourselves
#     removes a third-party community binary from the install's trust
#     boundary.
#
# EVERY artifact is VERIFIED before it is packaged: the built server is
# started for real, the extension is loaded, a vector is computed through it,
# and a pg_dump/pg_restore round trip completes. A build that compiles but
# does not load is worse than no build -- the install would provision a cluster
# whose vector extension silently refuses to activate, and the first embedding
# insert would fail with a message that points at the embedding code rather
# than at the extension.
#
# WHICH PART CANNOT BE VERIFIED HERE. The Windows extension build needs the
# MSVC toolchain and PostgreSQL's Windows headers, which the windows runner
# has and a Linux container does not. The recipe is the one pgvector documents
# for Windows (nmake /F Makefile.win), and the job verifies the build the same
# way the linux job does -- by loading the extension and computing a vector.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The upstream pgvector tag to build (e.g. v0.8.6)'
        required: true
        default: 'v0.8.6'
  push:
    tags:
      - 'pgbundle-v*'

permissions:
  contents: read

env:
  PG_VERSION: '17.6'
  # The sha256 published by postgresql.org for the source tarball. The build
  # refuses to proceed if the downloaded bytes do not hash to this.
  PG_SHA256: 'e0630a3600aea27511715563259ec2111cd5f4353a4b040e0be827f94cd7a8b0'

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # A platform that is not yet SHIPPED must not block the release the shipped
    # ones are in: the manifest pins one digest per platform, so a missing
    # darwin asset means "no macOS row yet", not "a broken release". The job is
    # still red in the run — that is the signal — and the publish job's summary
    # lists every platform it did and did not carry.
    #
    # NOTE the indirection through `matrix.experimental`: writing
    # `continue-on-error` directly inside a matrix `include` entry only creates
    # a matrix FIELD of that name; the job-level property is not read from the
    # matrix, so it silently did nothing.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: darwin-arm64
            # macos-14 is pinned to an arm64 image configuration this account
            # cannot start ("The configuration 'macos-14-arm64-us-default' is
            # not supported"), while macos-15 is the arm64 image it can.
            os: macos-15
            experimental: true
          - platform: darwin-x64
            # macos-13 -- the other Intel image -- is retired, so a job asking
            # for it queues forever. macos-15-intel is the x64 image.
            os: macos-15-intel
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the build toolchain (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bison flex ca-certificates git curl bzip2 patchelf

      - name: Install the build toolchain (macos)
        if: runner.os == 'macOS'
        run: |
          # bison and flex are the parser generators PostgreSQL's build
          # needs; install_name_tool (used to make the tree relocatable)
          # ships with the command line tools, which the runner image has.
          brew install bison flex

      - name: Build + verify + package the portable bundle
        run: bash scripts/build-postgres-pgvector/build-bundle.sh
        env:
          PGVECTOR_VERSION: ${{ inputs.version || 'v0.8.6' }}
          # ABSOLUTE, so the upload below and the script's `cd` into the
          # PostgreSQL source tree cannot disagree about where `out` is.
          OUT_DIR: ${{ github.workspace }}/out
          PREFIX: ${{ github.workspace }}/.bundle/pgsql
          SRC_DIR: ${{ github.workspace }}/.bundle/src

      - name: Upload the packaged bundle
        uses: actions/upload-artifact@v4
        with:
          name: postgres-pgvector-${{ matrix.platform }}
          path: ${{ github.workspace }}/out
          if-no-files-found: error

  extension:
    name: extension (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-amd64
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch the PostgreSQL 17.6 tree the install ships (windows)
        shell: pwsh
        run: |
          # The EDB "binaries without installer" archive is THE tree the
          # desktop install provisions. It carries the server, the client
          # tools AND the headers an extension compiles against (include/,
          # include/server/), so the extension is built against the exact
          # bytes users run -- no second PostgreSQL installation is needed,
          # and none is used.
          $url = 'https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip'
          # The SAME digest the installer's manifest pins. If EDB replaces
          # the archive behind this URL, the build must stop rather than
          # produce an extension for a server nobody ships.
          $wantSha = 'd378882abd001a186735acd6f6ba716bca6ccd192e800412d4fd15ed25376b3e'
          $zip = "$env:RUNNER_TEMP\pg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $gotSha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($gotSha -ne $wantSha) { throw "the EDB archive hashes to $gotSha, want $wantSha" }
          Expand-Archive $zip "$env:RUNNER_TEMP\pg"
          $pgRoot = "$env:RUNNER_TEMP\pg\pgsql"
          if (-not (Test-Path "$pgRoot\include\server\postgres.h")) {
            throw "the EDB archive carries no server headers at $pgRoot\include\server, so the extension cannot be built against it"
          }
          "$pgRoot\bin" >> $env:GITHUB_PATH
          "PG_ROOT=$pgRoot" >> $env:GITHUB_ENV

      - name: Build + verify + package the extension (windows)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-pgvector/build-pgvector-windows.ps1
        env:
          PGVECTOR_VERSION: ${{ inputs.version || 'v0.8.6' }}

      - name: Upload the packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: pgvector-${{ matrix.platform }}
          path: out
          if-no-files-found: error

  publish:
    name: publish the bundle
    needs: [bundle, extension]
    # !cancelled() rather than plain `success()`: an EXPERIMENTAL platform that
    # failed (see the bundle job) must not suppress the release the shipped
    # platforms are in. A cancellation still stops everything.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/pgbundle-v') }}
    runs-on: ubuntu-latest
    permissions:
      # The release is created in THIS repository, so the workflow's own
      # token is enough -- no separate credential is needed anywhere.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect the per-platform trees
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Checksums
        run: |
          cd dist
          # Each platform's tree becomes ONE zip, so the install can pin a
          # SINGLE digest per platform (the manifest pins one artifact, not a
          # directory of files).
          for d in */; do
            name="$(basename "$d")"
            (cd "$d" && zip -q -r "../${name}.zip" .)
            rm -rf "$d"
          done
          # The checksum file is written through a TEMP name and moved into
          # place: writing it directly would be a read and a write of the same
          # file in one pipeline (shellcheck SC2094), and the find could
          # otherwise see the half-written manifest. The temp name itself is
          # EXCLUDED from the find -- the first cut listed it, so every
          # published SHA256SUMS carried a digest for a file that is not in
          # the release.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' | LC_ALL=C sort | xargs -r sha256sum > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          # The sums file is only useful if it VERIFIES. This is the check the
          # file above got wrong, so it is asserted rather than assumed.
          sha256sum --check --quiet SHA256SUMS
          cat SHA256SUMS

      - name: Say which platforms this release carries
        run: |
          set -euo pipefail
          cd dist
          # A release that silently omits a platform is a release somebody
          # finds out about from a user. Every platform is named here, so the
          # run's summary answers "what is in this tag" without opening it.
          #
          # The SHIPPED platforms are REQUIRED; the others are reported as
          # missing without failing the release -- the manifest pins one
          # digest per platform, and a platform with no row yet is not part of
          # the contract.
          required="postgres-pgvector-linux-amd64.zip"
          expected="
            postgres-pgvector-linux-amd64.zip
            postgres-pgvector-linux-arm64.zip
            postgres-pgvector-darwin-arm64.zip
            postgres-pgvector-darwin-x64.zip
            pgvector-windows-amd64.zip
          "
          {
            echo "### desktop artifacts in \`${GITHUB_REF_NAME}\`"
            echo
            echo "| asset | size | sha256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for asset in $expected; do
            if [ -f "$asset" ]; then
              size="$(stat -c %s "$asset")"
              sha="$(sha256sum "$asset" | cut -d' ' -f1)"
              echo "| \`$asset\` | $size | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$asset\` | **not built** | — |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::$asset is not in this release"
            fi
          done
          for asset in $required; do
            [ -f "$asset" ] || { echo "::error::$asset is a SHIPPED platform's bundle and is missing"; exit 1; }
          done

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
